  html { background: var(--void); }
  body {

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 56px;
    padding: 12px 16px;

    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    text-decoration: none;

  .hint { display: block; color: var(--muted); font-size: 0.83rem; }
